name: devcontainer-image

# Builds the plain-Ubuntu dev image (no Nix involved) and publishes it to GHCR.
# Developers pull the published image; they never build it themselves.

on:
  push:
    branches: [ main ]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase path: owner/repo -> owner/repo-dev
      - name: Compute image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-dev" >> "$GITHUB_OUTPUT"

      - name: Publish image name
        run: |
          echo "### Dev container image: \`${{ steps.vars.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            "${{ steps.vars.outputs.image }}:latest" \
            bash -c 'cp -a /src /tmp/repo && cd /tmp/repo &&
                     cmake --preset Debug && cmake --build --preset Debug'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.vars.outputs.image }}:latest"
          docker push "${{ steps.vars.outputs.image }}:sha-${{ github.sha }}"
